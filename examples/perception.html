  <body>
    <a class="back-link" href="/#perception">&larr; All Examples</a>
    <h1>Perception</h1>
    <div id="game-container"></div>
    <div class="controls">
      <span
        ><kbd>WASD</kbd> move the blue target · <kbd>R</kbd> change reaction ·
        <kbd>C</kbd> toggle concealment</span
      >
      <span
        ><kbd>1</kbd> open sight · <kbd>2</kbd> behind cover ·
        <kbd>3</kbd> beyond range · <kbd>4</kbd> behind observer</span
      >
      <span
        >The wall blocks sight. The target can pass through it. An amber ring
        marks the last known position for three seconds.</span
      >
    </div>
