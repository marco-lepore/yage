<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAGE — Hotbar</title>
    <link rel="stylesheet" href="/shared.css" />
  </head>
  <body>
    <a class="back-link" href="/#hotbar">&larr; All Examples</a>
    <h1>Hotbar</h1>
    <div id="game-container"></div>
    <div class="controls">
      <span
        ><kbd>1–5</kbd> activate · <kbd>← →</kbd> select ·
        <kbd>Enter</kbd> activate selection · <kbd>Delete</kbd> clear</span
      >
      <span
        >Tap a slot to activate. Drag between slots to swap. Gamepad: LB/RB
        select, A activate, Y clear.</span
      >
      <span
        ><kbd>P</kbd> assign Potion · <kbd>S</kbd> save assignments ·
        <kbd>L</kbd> restore</span
      >
    </div>
    <script type="module" src="/src/hotbar/main.ts"></script>
  </body>
</html>
