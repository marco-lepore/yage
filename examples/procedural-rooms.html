<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAGE — Procedural Maps</title>
    <link rel="stylesheet" href="/shared.css" />
  </head>
  <body>
    <a class="back-link" href="/#procedural-rooms">&larr; All Examples</a>
    <h1>Procedural Maps</h1>
    <div id="game-container"></div>
    <div class="controls">
      <span
        ><kbd>1</kbd> dungeon · <kbd>2</kbd> catalog map · <kbd>3</kbd> cave ·
        <kbd>R</kbd> new seed</span
      >
      <span
        ><kbd>Tab</kbd> next target · <kbd>Space</kbd> walk there ·
        <kbd>Arrows</kbd> step</span
      >
      <span
        ><kbd>B</kbd> too small a budget · <kbd>U</kbd> rules no map can
        meet</span
      >
      <span
        >Walk into both treasure rooms to collect the keys that open the boss
        room. Gold dots show the route.</span
      >
    </div>
    <script type="module" src="/src/procedural-rooms/main.ts"></script>
  </body>
</html>
