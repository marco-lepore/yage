# Diagnostic only: the E2E suite with the dev servers' output kept, to find
# what navigates the level editor's play page. Some legs compete for the CPU
# with busy loops, to widen any timing window.
name: Diagnose editor play reload

on:
  push:
    branches: ["ci/diagnose-editor-play-reload"]

jobs:
  e2e:
    name: E2E (${{ matrix.scope }}, busy loops ${{ matrix.stress }}, leg ${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scope: full, stress: 0, leg: 1 }
          - { scope: full, stress: 0, leg: 2 }
          - { scope: full, stress: 0, leg: 3 }
          - { scope: full, stress: 0, leg: 4 }
          - { scope: full, stress: 4, leg: 5 }
          - { scope: full, stress: 4, leg: 6 }
          - { scope: editor, stress: 4, leg: 7 }
          - { scope: editor, stress: 8, leg: 8 }
    steps:
      - name: Describe the runner
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          free -m | head -2
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx turbo build --filter='!@yagejs/docs'
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 300 npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Run E2E
        working-directory: e2e
        env:
          DEBUG: pw:webserver
        run: |
          set +e
          busy=()
          for i in $(seq "${{ matrix.stress }}"); do
            (while :; do :; done) &
            busy+=($!)
          done
          project=""
          if [ "${{ matrix.scope }}" = "editor" ]; then project="--project=editor"; fi
          npx playwright test -c ../playwright.config.ts $project --retries=0 --reporter=list
          code=$?
          if [ "${#busy[@]}" -gt 0 ]; then kill "${busy[@]}"; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-leg-${{ matrix.leg }}
          path: test-results
          retention-days: 7
