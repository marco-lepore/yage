# Diagnostic only: the E2E suite with dev server and browser output kept, and
# Playwright's evaluation errors carrying Chrome's raw message, to find what
# fails the level editor's wait on its play page.
name: Diagnose editor play reload

on:
  push:
    branches: ["ci/diagnose-editor-play-reload"]

jobs:
  e2e:
    name: E2E (devtools session ${{ matrix.cdp }}, leg ${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cdp: "0", leg: 1 }
          - { cdp: "0", leg: 2 }
          - { cdp: "0", leg: 3 }
          - { cdp: "0", leg: 4 }
          - { cdp: "0", leg: 5 }
          - { cdp: "0", leg: 6 }
          - { cdp: "0", leg: 7 }
          - { cdp: "0", leg: 8 }
          - { cdp: "0", leg: 9 }
          - { cdp: "0", leg: 10 }
          - { cdp: "0", leg: 11 }
          - { cdp: "0", leg: 12 }
          - { cdp: "0", leg: 13 }
          - { cdp: "0", leg: 14 }
          - { cdp: "0", leg: 15 }
          - { cdp: "0", leg: 16 }
    steps:
      - name: Describe the runner
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          free -m | head -2
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx turbo build --filter='!@yagejs/docs'
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 300 npx playwright install --with-deps chromium
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Report Chrome's raw evaluation errors
        run: |
          node - node_modules/playwright-core/lib/coreBundle.js <<'EOF'
          const fs = require("fs");
          const file = process.argv[2];
          let source = fs.readFileSync(file, "utf8");
          const swaps = [
            [
              'throw new Error("Execution context was destroyed, most likely because of a navigation.");',
              'throw new Error("Execution context was destroyed, most likely because of a navigation. [protocol error: " + error.message + "]");',
              2,
            ],
            [
              'data.context.contextDestroyed("Execution context was destroyed, most likely because of a navigation");',
              'data.context.contextDestroyed("Execution context was destroyed, most likely because of a navigation [a new main-world context was created]");',
              1,
            ],
            [
              'context2.contextDestroyed("Execution context was destroyed, most likely because of a navigation");',
              'context2.contextDestroyed("Execution context was destroyed, most likely because of a navigation [Runtime.executionContextDestroyed]");',
              1,
            ],
          ];
          for (const [from, to, count] of swaps) {
            const found = source.split(from).length - 1;
            if (found !== count) throw new Error("expected " + count + " matches, found " + found + ": " + from);
            source = source.split(from).join(to);
          }
          fs.writeFileSync(file, source);
          console.log("patched Playwright's evaluation error messages");
          EOF
      - name: Run E2E
        working-directory: e2e
        env:
          DEBUG: pw:webserver,pw:browser
          DIAG_CDP: ${{ matrix.cdp }}
        run: npx playwright test -c ../playwright.config.ts --retries=0 --reporter=list
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-leg-${{ matrix.leg }}
          path: test-results
          retention-days: 7
