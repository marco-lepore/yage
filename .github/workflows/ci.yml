name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2, "codex/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo test
      - run: node --test scripts/clamp-package-versions.test.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo build

  docs-snippets:
    name: Docs snippets
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo build
      - run: npm run test:snippets --workspace @yagejs/docs
      - run: npm run docs:check

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx turbo build
      # Cache the downloaded browsers keyed on the lockfile (which pins the
      # Playwright version). Most runs restore from cache and skip the
      # flaky cdn.playwright.dev download entirely.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      # On a cache miss, download the browser + OS deps. The download has no
      # built-in timeout, so a stalled CDN connection would otherwise hang the
      # job for hours — wrap each attempt in `timeout` and retry a few times.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::playwright install attempt $i stalled or failed; retrying"
            fi
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      # On a cache hit the browser binary is already present, but the OS-level
      # system libraries it links against are not cached — install just those.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx turbo e2e
