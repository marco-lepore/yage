name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    branches: [main, v2, "codex/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job is independent and starts at once; Turbo's cache (restored by
# .github/actions/setup) is what keeps the repeated package builds cheap.
# The docs site is built by the `docs` job only, and only when docs changed.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx turbo lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx turbo typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Capped because the runner has four cores and every package's suite
      # spawns its own vitest workers on top of this. Uncapped, a warm cache
      # starts all thirty suites at once, each test gets a fraction of a core,
      # and the slower CPU-bound ones exceed vitest's five-second timeout.
      - run: npx turbo test --concurrency=50%
      - run: node --test scripts/clamp-package-versions.test.mjs

  # The Playwright suite runs on one worker per runner, so its projects are
  # split across jobs that run in parallel. The level editor's tests form one
  # serial group, so the two editors get a job of their own. Each job builds
  # the packages itself.
  e2e-suite:
    name: E2E ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: engine and examples
            projects: --project=fixtures --project=examples
          - suite: editors
            projects: --project=editor --project=sequence
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Builds every package except the docs site, so this job is also the
      # check that everything publishable builds.
      - run: npx turbo build --filter='!@yagejs/docs'
      # Cache the downloaded browsers keyed on the lockfile (which pins the
      # Playwright version). Most runs restore from cache and skip the
      # flaky cdn.playwright.dev download entirely.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      # On a cache miss, download the browser + OS deps. The download has no
      # built-in timeout, so a stalled CDN connection would otherwise hang the
      # job for hours — wrap each attempt in `timeout` and retry a few times.
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install --with-deps chromium && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::playwright install attempt $i stalled or failed; retrying"
            fi
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1
      # On a cache hit the browser binary is already present, but the OS-level
      # system libraries it links against are not cached — install just those.
      # apt can stall like the download, so it gets the same timeout and
      # retries.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            timeout 180 npx playwright install-deps chromium && exit 0
            if [ "$i" -lt 3 ]; then
              echo "::warning::playwright install-deps attempt $i stalled or failed; retrying"
            fi
          done
          echo "::error::playwright install-deps failed after 3 attempts"
          exit 1
      # `--only` runs the e2e task alone, on the packages built above. Turbo
      # hands the arguments after `--` to every task in the graph, so without
      # it each package build would hash differently and rebuild.
      - run: npx turbo e2e --only -- ${{ matrix.projects }}

  # The main-branch ruleset requires a check named E2E. This job reports the
  # suite jobs' combined result under that name.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [e2e-suite]
    if: "!cancelled()"
    steps:
      - name: Require every suite job to pass
        env:
          RESULT: ${{ needs.e2e-suite.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::E2E suite jobs finished with result: $RESULT"
            exit 1
          fi

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      docs: ${{ steps.docs.outputs.changed }}
    steps:
      - id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # A failed listing must fail the step, not read as "nothing changed".
        # The files endpoint lists paths for a pull request of any size; the
        # diff endpoint refuses one past 20,000 lines.
        run: |
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          if grep -qE '^docs/' <<< "$files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes]
    # `!cancelled()` keeps the job eligible on pushes, where `changes` is
    # skipped, without also running it after a superseded run is cancelled.
    if: "!cancelled() && (github.event_name == 'push' || needs.changes.outputs.docs == 'true')"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npx turbo build --filter=@yagejs/docs
