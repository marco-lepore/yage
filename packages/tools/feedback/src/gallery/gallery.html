<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="feedback-api" content="FEEDBACK_API_PATH" />
    <title>YAGE feedback</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #e4edf4;
        background: #101820;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 1440px;
        margin: auto;
        padding: 32px;
      }
      header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 20px;
      }
      h1 {
        font-size: 28px;
        margin: 0;
      }
      h2 {
        margin: 0 0 12px;
      }
      p {
        margin: 8px 0;
      }
      small,
      .muted {
        color: #a6b7c6;
      }
      .project {
        overflow-wrap: anywhere;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        margin: 24px 0 12px;
        position: sticky;
        top: 0;
        background: #101820;
        padding: 12px 0;
        z-index: 1;
      }
      button,
      select,
      input,
      textarea {
        font: inherit;
        color: inherit;
        background: #213140;
        border: 1px solid #4b6375;
        border-radius: 7px;
        padding: 9px 12px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        background: #30495d;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #79d8d1;
        outline-offset: 3px;
      }
      input[type="search"] {
        min-width: 200px;
        flex: 1;
      }
      input[type="checkbox"] {
        accent-color: #79d8d1;
        width: 18px;
        height: 18px;
      }
      label {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        border: 1px solid #324858;
        border-radius: 10px;
        overflow: hidden;
        background: #192631;
      }
      .card:has(input:checked) {
        border-color: #79d8d1;
      }
      .preview {
        padding: 0;
        border: 0;
        border-radius: 0;
        display: block;
        width: 100%;
        background: #0b1218;
      }
      .preview img {
        display: block;
        width: 100%;
        aspect-ratio: 16/9;
        object-fit: contain;
      }
      .content {
        padding: 16px;
      }
      .comment {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        margin: 12px 0;
      }
      .card .comment {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .badge {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #79d8d1;
        margin-left: auto;
      }
      .meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        margin: 24px;
      }
      dialog {
        color: inherit;
        background: #15222c;
        border: 1px solid #4b6375;
        border-radius: 12px;
        width: min(1200px, 95vw);
        max-height: 92vh;
        padding: 24px;
      }
      dialog::backdrop {
        background: #000a;
      }
      .detail-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(260px, 1fr);
        gap: 24px;
        margin-top: 20px;
      }
      .capture {
        position: relative;
        width: 100%;
        align-self: start;
      }
      .capture img {
        display: block;
        width: 100%;
      }
      .outline {
        position: absolute;
        border: 2px solid #ffca66;
        background: #ffca661a;
        pointer-events: none;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 12px;
        max-height: 350px;
        overflow: auto;
        background: #0d1720;
        padding: 12px;
      }
      summary {
        cursor: pointer;
        padding: 8px 0;
      }
      .error {
        color: #ffafab;
      }
      textarea {
        width: 100%;
        min-height: 130px;
      }
      a {
        color: #79d8d1;
      }
      @media (max-width: 720px) {
        main {
          padding: 16px;
        }
        header {
          flex-direction: column;
        }
        .detail-grid {
          grid-template-columns: 1fr;
        }
        .toolbar {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Feedback</h1>
          <p class="muted project" id="project">Loading project…</p>
        </div>
        <button id="refresh">Refresh</button>
      </header>
      <div class="toolbar">
        <label
          >Status
          <select id="status">
            <option value="pending">Pending</option>
            <option value="open">Open</option>
            <option value="ingested">Ingested</option>
            <option value="addressed">Addressed</option>
            <option value="resolved">Resolved</option>
            <option value="all">All</option>
          </select></label
        >
        <input
          type="search"
          id="search"
          aria-label="Search comments"
          placeholder="Search comments or entity names"
        />
        <button id="select-page">Select page</button
        ><button id="clear">Clear selection</button>
        <button id="codex" disabled>Copy for Codex</button
        ><button id="claude" disabled>Copy for Claude</button>
      </div>
      <p id="summary" class="muted"></p>
      <p id="message" role="status"></p>
      <div class="grid" id="cards"></div>
      <div class="pagination">
        <button id="previous">Previous</button><span id="page"></span
        ><button id="next">Next</button>
      </div>
    </main>
    <dialog id="detail" aria-labelledby="detail-title">
      <header>
        <h2 id="detail-title">Comment evidence</h2>
        <button id="close-detail">Close</button>
      </header>
      <div id="evidence"></div>
    </dialog>
    <dialog id="copy" aria-labelledby="copy-title">
      <header>
        <h2 id="copy-title">Paste into your agent session</h2>
        <button id="close-copy">Close</button>
      </header>
      <p>Clipboard access was unavailable. Copy this instruction:</p>
      <textarea
        id="instruction"
        readonly
        aria-label="Agent instruction"
      ></textarea>
    </dialog>
    <script type="module" src="./gallery.js"></script>
  </body>
</html>
