<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>My YAGE Game</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0f172a;
        color: #e2e8f0;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        overflow: hidden;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        /* Paints the padding below, also in fullscreen, where body is not
           drawn behind #game. */
        background: inherit;
        width: 100vw;
        /* Fallback for browsers without dvh. */
        height: 100vh;
        /* The visible height: excludes the mobile browser's toolbars. */
        height: 100dvh;
        /* Keeps the game clear of the notch, rounded corners, and home
           indicator. Each inset is 0 where the screen has none. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #game canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
